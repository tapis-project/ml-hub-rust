apiVersion: batch/v1
kind: Job
metadata:
  name: mlhub-hf-model-etl
spec:
  backoffLimit: 0
  template:
    metadata:
      name: mlhub-hf-model-etl
    spec:
      restartPolicy: Never
      # initContainers:
      #   - name: extract
      #     env:
      #       - name: RUST_LOG
      #         value: debug
      #       - name: INBOX
      #         value: /srv/mlhub/hf-model-etl/inbox
      #       - name: HF_TOKEN
      #         value: '{{ HF_TOKEN }}'
      #       - name: MAX_RECORDS
      #         value: '10000'
      #     image: mlhub/hf-model-etl-extract:local
      #     command: ["sh", "-c", "python3 src/extract.py"]
      #     volumeMounts:
      #       - name: nfs-server-mount
      #         mountPath: /srv/mlhub/
      containers:
        - name: hf-model-etl
          env:
            - name: RUST_LOG
              value: debug
            - name: MONGO_HOST
              value: mlhub-mongo-service
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_NAME
              value: mlhub
            - name: MONGO_PASSWORD
              value: password
            - name: MONGO_USERNAME
              value: mlhub
            - name: MAX_PROCESSABLE_ENTRIES
              value: "10000"
            - name: INBOX
              value: /srv/mlhub/hf-model-etl/inbox
          image: mlhub/hf-model-etl-transform-load:local
          imagePullPolicy: Never
          resources: {}
          tty: true
          volumeMounts:
            - name: nfs-server-mount
              mountPath: /srv/mlhub/
      volumes:
      - name: nfs-server-mount
        nfs:
          server: '{{ NFS_SERVER_COMPONENT_IP }}'
          path: /
