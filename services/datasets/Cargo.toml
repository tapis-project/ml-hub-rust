[package]
name = "datasets"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "datasets-openapi"
path = "src/bin/openapi.rs"

[dependencies]
actix-web = "4"
env_logger = "0.11.5"
log = "0.4"
mongodb = "3.5.1"
shared = { version = "0.1.0", path = "../../libs/shared" }
utoipa = "5.4.0"
serde_json = { workspace = true }
validator = { workspace = true }
uuid = { version = "1", features = ["serde"] }
