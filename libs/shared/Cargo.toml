[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[features]
default = ["actix", "mongo"]
actix = ["actix-web", "actix-multipart"]
mongo = ["mongodb"]

[dependencies]
agntcy-sdk = { version = "0.8.0", path = "../../sdks/agntcy-sdk" }
platforms = { version = "0.1.0", path = "../../libs/platforms" }
huggingface-tasks = { version = "0.1.0", path = "../../libs/huggingface-tasks" }
retry-utils = { version = "0.1.0", path = "../../libs/retry-utils" }
actix-multipart = {version = "0.7.2", optional = true}
actix-web = {version = "4", optional = true}
amqprs = "2.1.1"
async-trait = "0.1.88"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
futures-util = "0.3"
log = "0.4"
once_cell = "1.21.3"
openapiv3 = "2.0.0"
rand = { version = "0.9.1", features = ["thread_rng"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
strum = "0.27.0"
strum_macros = "0.27.0"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["time"] }
tokio-retry = "0.3.0"
uuid = { version = "1.15.1", features = ["v7", "v4"] }
zip = "3.0.0"
mongodb = { version = "3.5.1", optional = true }
bson = { version = "2", features = ["chrono-0_4"] }
futures = "0.3.31"
utoipa = { version = "5.4.0", features = ["uuid", "macros"]}
utoipa-swagger-ui = "9.0.2"
validator = { version = "0.20.0", features = ["derive"] }
partially = { version = "0.2.1", features = ["derive"] }
heck = "0.5.0"
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
tapis-authenticator = "0.2.0"
tapis-tenants = "0.2.0"
base64 = "0.22.1"
flexserv-deployer = { git = "https://github.com/tapis-project/FlexServ-Deployer.git", rev = "8da1963" }
url-parse = "1.0.10"
