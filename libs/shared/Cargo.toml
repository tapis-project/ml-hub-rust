[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[features]
default = ["actix", "mongo"]
actix = ["actix-web", "actix-multipart"]
mongo = ["mongodb"]

[dependencies]
agntcy-sdk = { version = "0.8.0", path = "../../sdks/agntcy-sdk" }
platforms = { version = "0.1.0", path = "../../libs/platforms" }
huggingface-tasks = { version = "0.1.0", path = "../../libs/huggingface-tasks" }
retry-utils = { version = "0.1.0", path = "../../libs/retry-utils" }
actix-multipart = {version = "0.7.2", optional = true}
actix-web = {version = "4", optional = true}
amqprs = "2.1.1"
async-trait = "0.1.88"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
futures-util = "0.3"
log = "0.4"
once_cell = "1.21.3"
openapiv3 = "2.0.0"
rand = { version = "0.9.1", features = ["thread_rng"] }
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["time"] }
tokio-retry = "0.3.0"
uuid = { version = "1.15.1", features = ["v7", "v4"] }
zip = "3.0.0"
mongodb = { version = "3.5.1", optional = true }
bson = { version = "2", features = ["chrono-0_4"] }
futures = "0.3.31"
utoipa = { version = "5.4.0", features = ["uuid", "macros"]}
utoipa-swagger-ui = { version = "9.0.2", features = ["reqwest"] }
partially = { version = "0.2.1", features = ["derive"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
tapis-tokens = "0.4.4"
tapis-authenticator = "0.4.4"
tapis-tenants = "0.4.4"
tapis-jobs = "0.4.4"
base64 = "0.23.0"
reqwest = { version = "0.12", features = ["json"] }
# flexserv-deployer = { git = "https://github.com/tapis-project/FlexServ-Deployer.git", rev = "1d0fc84" }
url-parse = "1.0.10"
derive_more = { version = "2.1.1", features = ["as_ref"] }
nonempty = { version = "0.12.0", features = ["serialize"] }
kube = { version = "4.2.0", features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
validator = { workspace = true }
