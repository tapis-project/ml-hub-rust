apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mlhub-model-deployment-controller-deployment
  name: mlhub-model-deployment-controller-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlhub-model-deployment-controller-deployment
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mlhub-model-deployment-controller-deployment
    spec:
      containers:
        - env:
            - name: RUST_LOG
              value: debug
            - name: ARTIFACTS_DB_HOST
              value: mlhub-artifact-db-service
            - name: ARTIFACTS_DB_PORT
              value: "27017"
            - name: ARTIFACTS_DB_NAME
              value: mlhub
            - name: ARTIFACTS_DB_PASSWORD
              value: password
            - name: ARTIFACTS_DB_USERNAME
              value: mlhub
            - name: SHARED_DATA
              value: /srv/mlhub
            - name: ARTIFACT_OP_MQ_HOST
              value: mlhub-artifact-mq-service
            - name: ARTIFACT_OP_MQ_PASSWORD
              value: dev
            - name: ARTIFACT_OP_MQ_PORT
              value: "5672"
            - name: ARTIFACT_OP_MQ_USER
              value: dev
          image: mlhub/model-deployment-controller:local
          imagePullPolicy: Never
          name: model-deployment-controller
          resources: {}
          tty: true
          volumeMounts:
              - name: nfs-server-mount
                mountPath: /srv/mlhub/
              - name: tapis-deployment-strategies
                mountPath: /etc/mlhub/deployment-strategies.d/tapis.json
                subPath: tapis.json
      volumes:
        - name: nfs-server-mount
          nfs:
            server: '{{ NFS_SERVER_COMPONENT_IP }}'
            path: /
        - name: tapis-deployment-strategies
          configMap:
            name: tapis-deployment-strategies
      restartPolicy: Always
