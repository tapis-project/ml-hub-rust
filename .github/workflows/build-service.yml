name: Build Service

on:
  workflow_call:
    inputs:
      compile_cmd:
        required: true
        type: string
      build_cmd:
        required: true
        type: string
      push_cmd:
        required: true
        type: string

jobs:
    build:
      runs-on: ubuntu-latest
  
      steps:
      - uses: actions/checkout@v4
  
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
  
      - name: Compile
        run: ${{ inputs.compile_cmd }}
  
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.CIC_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CIC_DOCKERHUB_ACCESS_TOKEN }}
  
      - name: Build Image
        run: ${{ inputs.build_cmd }}
  
      - name: Push Image
        run: ${{ inputs.push_cmd }}