openapi: 3.1.0
info:
  title: MLHub Deployments API
  description: ''
  license:
    name: ''
  version: 0.1.0
paths:
  /deployments-api/data-centers/{data_center}/hpc-clusters:
    get:
      tags:
        - Targets
      summary: List HPC clusters in a data center
      operationId: list_hpc_clusters
      parameters:
        - name: data_center
          in: path
          required: true
          schema:
            type: string
            enum:
              - Tacc
        - name: limit
          in: query
          description: Maximum number of HPC clusters to return. Values are capped at 100.
          required: false
          schema:
            type: integer
            format: int32
            maximum: 100
            minimum: 1
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous page.
          required: false
          schema:
            type: string
        - name: include_count
          in: query
          description: Include the number of HPC clusters in the selected data center.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: HPC clusters listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHpcClustersResponse'
        '400':
          description: Invalid data center or pagination parameters
        '500':
          description: Unable to list HPC clusters
  /deployments-api/data-centers/{data_center}/hpc-clusters/{hpc_cluster_id}:
    get:
      tags:
        - Targets
      summary: Get an HPC cluster
      operationId: get_hpc_cluster
      parameters:
        - name: data_center
          in: path
          required: true
          schema:
            type: string
            enum:
              - Tacc
        - name: hpc_cluster_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: HPC cluster found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHpcClusterResponse'
        '400':
          description: Invalid data center or HPC cluster ID
        '404':
          description: HPC cluster not found
        '500':
          description: Unable to get HPC cluster
  /deployments-api/deployments:
    get:
      tags:
        - Deployments
      description: Lists all available deployments
      operationId: list_model_deployments
      responses:
        '200':
          description: A list of model deployments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelDeploymentsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
    post:
      tags:
        - Deployments
      description: Deploy an ExternalModel with a deployment option
      operationId: deploy_model_with_option
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployModelWithOptionBody'
        required: true
      responses:
        '201':
          description: Model deployment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDeploymentResponse'
        '400':
          description: Invalid deployment request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Deployment option, ExternalModel, or target not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Deployment option is unavailable
        '500':
          description: Unable to create deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /deployments-api/deployments/{deployment_id}/start:
    post:
      tags:
        - Deployments
      description: Start a model deployment on its selected target
      operationId: start_model_deployment
      parameters:
        - name: deployment_id
          in: path
          description: The id of the Model Deployment
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Model deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDeploymentResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /deployments-api/deployments/{deployment_id}/stop:
    post:
      tags:
        - Deployments
      description: Stop a Model Deployment
      operationId: stop_model_deployment
      parameters:
        - name: deployment_id
          in: path
          description: The the id of the Model Deployment
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Model deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDeploymentResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /deployments-api/deployments/{deployment_id}/undeploy:
    post:
      tags:
        - Deployments
      description: Undeploy a Model Deployment
      operationId: undeploy_model_deployment
      parameters:
        - name: deployment_id
          in: path
          description: The the id of the Model Deployment
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Model deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDeploymentResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
components:
  schemas:
    AcceleratorType:
      type: string
      enum:
        - Gpu
    Argument:
      type: object
      required:
        - parameter_name
        - value
      properties:
        parameter_name:
          type: string
        value:
          type: string
    BadRequestResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result: {}
        status:
          type: integer
          format: int32
          default: 400
          minimum: 0
        version:
          type: string
    BatchSchedulerQueue:
      type: object
      required:
        - id
        - cluster_id
        - enabled
        - name
        - scheduler_type
        - hardware_profile
        - scheduling_policy
      properties:
        billing_policy:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/BillingPolicy'
        cluster_id:
          type: string
          format: uuid
        enabled:
          type: boolean
        hardware_profile:
          $ref: '#/components/schemas/HardwareProfile'
        id:
          type: string
          format: uuid
        name:
          type: string
        scheduler_type:
          $ref: '#/components/schemas/SchedulerType'
        scheduling_policy:
          $ref: '#/components/schemas/SchedulingPolicy'
    BillingMetric:
      type: string
      enum:
        - PerNodeHour
        - PerGpuHour
        - PerCoreHour
    BillingPolicy:
      type: object
      required:
        - metric
        - queue_multiplier
      properties:
        metric:
          $ref: '#/components/schemas/BillingMetric'
        queue_multiplier:
          type: number
          format: double
    ContainerRuntime:
      type: string
      enum:
        - Apptainer
        - SingularityCe
        - Enroot
        - Charliecloud
        - Shifter
        - Sarus
        - Podman
        - Docker
    DataCenter:
      type: string
      enum:
        - Tacc
    DeployModelWithOptionBody:
      type: object
      required:
        - name
        - deployment_option_id
        - deployment_modality
      properties:
        arguments:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/Argument'
        deployment_modality:
          $ref: '#/components/schemas/DeploymentModality'
        deployment_option_id:
          type: string
          format: uuid
        description:
          type:
            - string
            - 'null'
        name:
          type: string
        parallelism_strategies:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/ParallelismStrategy'
        replicas:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 0
    DeploymentModality:
      type: string
      enum:
        - Batch
        - Service
    DesiredState:
      type: string
      enum:
        - Running
        - Stopped
        - NotDeployed
    GetHpcClusterResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          $ref: '#/components/schemas/HpcCluster'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    GpuProfile:
      type: object
      required:
        - count_per_node
        - gpu_model
        - gpu_vendor
        - gpu_memory_gb
        - unified_memory
      properties:
        count_per_node:
          type: integer
          format: int32
          minimum: 0
        gpu_memory_gb:
          type: integer
          format: int32
          minimum: 0
        gpu_model:
          type: string
        gpu_vendor:
          type: string
        unified_memory:
          type: boolean
    HardwareProfile:
      type: object
      required:
        - total_nodes
        - cpu_cores_per_node
        - cpu_architecture
        - cpu_model
        - cpu_vendor
        - memory_gb
        - accelerator_type
        - gpu
      properties:
        accelerator_type:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AcceleratorType'
        cpu_architecture:
          type: string
        cpu_cores_per_node:
          type: integer
          format: int32
          minimum: 0
        cpu_model:
          type: string
        cpu_vendor:
          type: string
        gpu:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/GpuProfile'
        memory_gb:
          type: integer
          format: int32
          minimum: 0
        total_nodes:
          type: integer
          format: int32
          minimum: 0
    HpcCluster:
      type: object
      required:
        - id
        - enabled
        - name
        - host
        - port
        - container_runtimes
        - data_center
        - queues
      properties:
        container_runtimes:
          type: array
          items:
            $ref: '#/components/schemas/ContainerRuntime'
        data_center:
          $ref: '#/components/schemas/DataCenter'
        description:
          type:
            - string
            - 'null'
        documentation_url:
          type:
            - string
            - 'null'
        enabled:
          type: boolean
        host:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        port:
          type: integer
          format: int32
          minimum: 0
        queues:
          type: array
          items:
            $ref: '#/components/schemas/BatchSchedulerQueue'
    HpcClusterSummary:
      type: object
      required:
        - id
        - enabled
        - name
        - data_center
      properties:
        data_center:
          $ref: '#/components/schemas/DataCenter'
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        name:
          type: string
    ListHpcClustersResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          type: array
          items:
            $ref: '#/components/schemas/HpcClusterSummary'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    ListModelDeploymentsResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          type: array
          items:
            $ref: '#/components/schemas/ModelDeployment'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    ModelDeployment:
      type: object
      required:
        - id
        - name
        - tenant_id
        - owner
        - external_model_id
        - deployment_option_id
        - deployment_modality
        - state
        - desired_state
        - visibility
        - created_at
        - last_modified
        - last_state_change
        - last_desired_state_change
        - replicas
        - revision
      properties:
        created_at:
          type: string
        deployment_interface:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ModelDeploymentInterface'
        deployment_modality:
          $ref: '#/components/schemas/DeploymentModality'
        deployment_option_id:
          type: string
          format: uuid
        description:
          type:
            - string
            - 'null'
        desired_state:
          $ref: '#/components/schemas/DesiredState'
        external_model_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        last_desired_state_change:
          type: string
        last_message:
          type:
            - string
            - 'null'
        last_modified:
          type: string
        last_state_change:
          type: string
        metadata:
          type:
            - object
            - 'null'
          additionalProperties: {}
          propertyNames:
            type: string
        name:
          type: string
        owner:
          type: string
        replicas:
          $ref: '#/components/schemas/ReplicaGroup'
        revision:
          type: integer
          format: int32
          minimum: 0
        state:
          $ref: '#/components/schemas/State'
        tenant_id:
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
    ModelDeploymentInterface:
      type: object
      required:
        - interface_type
      properties:
        interface_type:
          $ref: '#/components/schemas/ModelDeploymentInterfaceType'
        rest_api:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/RestApi'
    ModelDeploymentInterfaceType:
      type: string
      enum:
        - RestApi
    ModelDeploymentResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          $ref: '#/components/schemas/ModelDeployment'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    NotFoundResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result: {}
        status:
          type: integer
          format: int32
          default: 404
          minimum: 0
        version:
          type: string
    ParallelismStrategy:
      type: string
      enum:
        - PipelineParallelism
        - TensorParallelism
        - SequenceParallelism
        - ContextParallelism
        - ExpertParallelism
    ReplicaGroup:
      type: object
      required:
        - count
        - parallelism_strategies
      properties:
        count:
          type: integer
          format: int32
          minimum: 0
        parallelism_strategies:
          type: array
          items:
            $ref: '#/components/schemas/ParallelismStrategy'
    RestApi:
      type: object
      required:
        - spec
      properties:
        spec: {}
    SchedulerType:
      type: string
      enum:
        - Slurm
    SchedulingPolicy:
      type: object
      required:
        - min_nodes_per_job
        - max_nodes_per_job
        - max_jobs_per_user
        - max_nodes_per_user
        - max_wall_time_per_job_hr
        - max_job_submission
      properties:
        max_job_submission:
          type: integer
          format: int32
          minimum: 0
        max_jobs_per_user:
          type: integer
          format: int32
          minimum: 0
        max_nodes_per_job:
          type: integer
          format: int32
          minimum: 0
        max_nodes_per_user:
          type: integer
          format: int32
          minimum: 0
        max_wall_time_per_job_hr:
          type: integer
          format: int32
          minimum: 0
        min_nodes_per_job:
          type: integer
          format: int32
          minimum: 0
    ServerErrorResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result: {}
        status:
          type: integer
          format: int32
          default: 500
          minimum: 0
        version:
          type: string
    State:
      type: string
      enum:
        - NotDeployed
        - Running
        - Stopped
        - Failed
        - Blocked
        - Unknown
    Visibility:
      type: string
      enum:
        - Public
        - Private
