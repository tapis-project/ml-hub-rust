openapi: 3.0.3
info:
  title: MLHub Deployments API
  description: ''
  license:
    name: ''
  version: 0.1.0
paths:
  /deployments-api/data-centers/{data_center}/hpc-clusters:
    get:
      tags:
        - Targets
      summary: List HPC clusters in a data center
      operationId: list_hpc_clusters
      parameters:
        - name: data_center
          in: path
          required: true
          schema:
            type: string
            enum:
              - Tacc
        - name: limit
          in: query
          description: Maximum number of HPC clusters to return. Values are capped at 100.
          required: false
          schema:
            type: integer
            format: int32
            maximum: 100
            minimum: 1
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous page.
          required: false
          schema:
            type: string
        - name: include_count
          in: query
          description: Include the number of HPC clusters in the selected data center.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: HPC clusters listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHpcClustersResponse'
        '400':
          description: Invalid data center or pagination parameters
        '500':
          description: Unable to list HPC clusters
  /deployments-api/data-centers/{data_center}/hpc-clusters/{hpc_cluster_id}:
    get:
      tags:
        - Targets
      summary: Get an HPC cluster
      operationId: get_hpc_cluster
      parameters:
        - name: data_center
          in: path
          required: true
          schema:
            type: string
            enum:
              - Tacc
        - name: hpc_cluster_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: HPC cluster found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHpcClusterResponse'
        '400':
          description: Invalid data center or HPC cluster ID
        '404':
          description: HPC cluster not found
        '500':
          description: Unable to get HPC cluster
  /deployments-api/deployments:
    get:
      tags:
        - Deployments
      description: Lists all available deployments
      operationId: list_model_deployments
      responses:
        '200':
          description: A list of model deployments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelDeploymentsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /deployments-api/deployments/{deployment_id}/start:
    post:
      tags:
        - Deployments
      description: Deploy a model to a target platform
      operationId: start_model_deployment
      parameters:
        - name: deployment_id
          in: path
          description: The id of the Model Deployment
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Model deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDeploymentResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /deployments-api/deployments/{deployment_id}/stop:
    post:
      tags:
        - Deployments
      description: Stop a Model Deployment
      operationId: stop_model_deployment
      parameters:
        - name: deployment_id
          in: path
          description: The the id of the Model Deployment
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Model deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDeploymentResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /deployments-api/deployments/{deployment_id}/undeploy:
    post:
      tags:
        - Deployments
      description: Undeploy a Model Deployment
      operationId: undeploy_model_deployment
      parameters:
        - name: deployment_id
          in: path
          description: The the id of the Model Deployment
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Model deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDeploymentResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /deployments-api/platforms/{platform}/strategies/{strategy_name}:
    post:
      tags:
        - Deployments
      description: Deploy a model to a target platform
      operationId: deploy_model_with_strategy
      parameters:
        - name: platform
          in: path
          description: The target platform for the Model Deployment
          required: true
          schema:
            $ref: '#/components/schemas/Platform'
        - name: strategy_name
          in: path
          description: The name of the deployment strategy
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployModelWithStrategyBody'
        required: true
      responses:
        '200':
          description: Model deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDeploymentResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /deployments-api/strategies:
    get:
      tags:
        - Strategies
      description: Lists all available deployment strategies for all platforms
      operationId: list_strategies
      responses:
        '200':
          description: A list of all deployment strategies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDeploymentStrategiesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
components:
  schemas:
    AcceleratorType:
      type: string
      enum:
        - Gpu
    Argument:
      type: object
      required:
        - parameter_name
        - value
      properties:
        parameter_name:
          type: string
        value:
          type: string
    BadRequestResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result: {}
        status:
          type: integer
          format: int32
          default: 400
          minimum: 0
        version:
          type: string
    BatchSchedulerQueue:
      type: object
      required:
        - id
        - cluster_id
        - name
        - scheduler_type
        - hardware_profile
        - scheduling_policy
      properties:
        billing_policy:
          $ref: '#/components/schemas/BillingPolicy'
          nullable: true
        cluster_id:
          type: string
          format: uuid
        hardware_profile:
          $ref: '#/components/schemas/HardwareProfile'
        id:
          type: string
          format: uuid
        name:
          type: string
        scheduler_type:
          $ref: '#/components/schemas/SchedulerType'
        scheduling_policy:
          $ref: '#/components/schemas/SchedulingPolicy'
    BillingMetric:
      type: string
      enum:
        - PerNodeHour
        - PerGpuHour
        - PerCoreHour
    BillingPolicy:
      type: object
      required:
        - metric
        - queue_multiplier
      properties:
        metric:
          $ref: '#/components/schemas/BillingMetric'
        queue_multiplier:
          type: number
          format: double
    Choice:
      type: object
      required:
        - value
        - enabled
      properties:
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        value:
          type: string
    DataCenter:
      type: string
      enum:
        - Tacc
    DeployModelWithStrategyBody:
      type: object
      required:
        - name
        - model_id
        - deployment_modality
      properties:
        arguments:
          type: array
          items:
            $ref: '#/components/schemas/Argument'
          nullable: true
        deployment_modality:
          $ref: '#/components/schemas/DeploymentModality'
        description:
          type: string
          nullable: true
        model_id:
          type: string
          format: uuid
        name:
          type: string
        parallelism_strategies:
          type: array
          items:
            $ref: '#/components/schemas/ParallelismStrategy'
          nullable: true
        replicas:
          type: integer
          format: int32
          minimum: 0
          nullable: true
    DeploymentModality:
      type: string
      enum:
        - Batch
        - Service
    DesiredState:
      type: string
      enum:
        - Running
        - Stopped
        - NotDeployed
    GetHpcClusterResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          $ref: '#/components/schemas/HpcCluster'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    GpuProfile:
      type: object
      required:
        - count_per_node
        - gpu_model
        - gpu_vendor
        - gpu_memory_gb
        - unified_memory
      properties:
        count_per_node:
          type: integer
          format: int32
          minimum: 0
        gpu_memory_gb:
          type: integer
          format: int32
          minimum: 0
        gpu_model:
          type: string
        gpu_vendor:
          type: string
        unified_memory:
          type: boolean
    HardwareProfile:
      type: object
      required:
        - total_nodes
        - cpu_cores_per_node
        - cpu_architecture
        - cpu_model
        - cpu_vendor
        - memory_gb
        - accelerator_type
        - gpu
      properties:
        accelerator_type:
          $ref: '#/components/schemas/AcceleratorType'
          nullable: true
        cpu_architecture:
          type: string
        cpu_cores_per_node:
          type: integer
          format: int32
          minimum: 0
        cpu_model:
          type: string
        cpu_vendor:
          type: string
        gpu:
          $ref: '#/components/schemas/GpuProfile'
          nullable: true
        memory_gb:
          type: integer
          format: int32
          minimum: 0
        total_nodes:
          type: integer
          format: int32
          minimum: 0
    HpcCluster:
      type: object
      required:
        - id
        - name
        - host
        - port
        - data_center
        - queues
      properties:
        data_center:
          $ref: '#/components/schemas/DataCenter'
        description:
          type: string
          nullable: true
        documentation_url:
          type: string
          nullable: true
        host:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        port:
          type: integer
          format: int32
          minimum: 0
        queues:
          type: array
          items:
            $ref: '#/components/schemas/BatchSchedulerQueue'
    HpcClusterSummary:
      type: object
      required:
        - id
        - name
        - data_center
      properties:
        data_center:
          $ref: '#/components/schemas/DataCenter'
        id:
          type: string
          format: uuid
        name:
          type: string
    ListDeploymentStrategiesResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          type: array
          items:
            $ref: '#/components/schemas/Strategy'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    ListHpcClustersResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          type: array
          items:
            $ref: '#/components/schemas/HpcClusterSummary'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    ListModelDeploymentsResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          type: array
          items:
            $ref: '#/components/schemas/ModelDeployment'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    ModelDeployment:
      type: object
      required:
        - id
        - name
        - platform
        - owner
        - model
        - state
        - desired_state
        - visibility
        - created_at
        - last_modified
        - last_state_change
        - last_desired_state_change
        - replicas
        - revision
      properties:
        created_at:
          type: string
        deployment_interface:
          $ref: '#/components/schemas/ModelDeploymentInterface'
          nullable: true
        deployment_strategy:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        desired_state:
          $ref: '#/components/schemas/DesiredState'
        id:
          type: string
          format: uuid
        last_desired_state_change:
          type: string
        last_message:
          type: string
          nullable: true
        last_modified:
          type: string
        last_state_change:
          type: string
        metadata:
          type: object
          additionalProperties: {}
          nullable: true
        model:
          $ref: '#/components/schemas/ModelReference'
        name:
          type: string
        owner:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        replicas:
          $ref: '#/components/schemas/ReplicaGroup'
        revision:
          type: integer
          format: int32
          minimum: 0
        state:
          $ref: '#/components/schemas/State'
        visibility:
          $ref: '#/components/schemas/Visibility'
    ModelDeploymentInterface:
      oneOf:
        - type: object
          required:
            - RestApi
          properties:
            RestApi:
              $ref: '#/components/schemas/RestApi'
    ModelDeploymentResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          $ref: '#/components/schemas/ModelDeployment'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    ModelReference:
      type: object
      required:
        - model_id
      properties:
        model_id:
          type: string
          format: uuid
    NotFoundResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result: {}
        status:
          type: integer
          format: int32
          default: 404
          minimum: 0
        version:
          type: string
    ParallelismStrategy:
      type: string
      enum:
        - PipelineParallelism
        - TensorParallelism
        - SequenceParallelism
        - ContextParallelism
        - ExpertParallelism
    Parameter:
      type: object
      required:
        - name
        - required
        - secret
        - type
      properties:
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
          nullable: true
        default:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        name:
          type: string
        required:
          type: boolean
        secret:
          type: boolean
        type:
          $ref: '#/components/schemas/ParameterType'
    ParameterType:
      type: string
      enum:
        - String
        - Integer
        - Float
        - Boolean
    Platform:
      type: string
      description: >-
        Represents a platform for which there are clients registered for one or
        more of

        the following APIs: Models, Datasets, Inference, Training. The
        strum(serialize="")

        attribute corresponds to the desired "platform" path parameter passed to
        the

        `get_client` method of a registrar.
      enum:
        - hugging-face
        - github
        - git
        - patra
        - tapis-pods
        - tapis-jobs
        - s3
    ReplicaGroup:
      type: object
      required:
        - count
        - parallelism_strategies
      properties:
        count:
          type: integer
          format: int32
          minimum: 0
        parallelism_strategies:
          type: array
          items:
            $ref: '#/components/schemas/ParallelismStrategy'
    RestApi:
      type: object
      required:
        - spec
      properties:
        spec: {}
    SchedulerType:
      type: string
      enum:
        - Slurm
    SchedulingPolicy:
      type: object
      required:
        - min_nodes_per_job
        - max_nodes_per_job
        - max_jobs_per_user
        - max_nodes_per_user
        - max_wall_time_per_job_hr
        - max_job_submission
      properties:
        max_job_submission:
          type: integer
          format: int32
          minimum: 0
        max_jobs_per_user:
          type: integer
          format: int32
          minimum: 0
        max_nodes_per_job:
          type: integer
          format: int32
          minimum: 0
        max_nodes_per_user:
          type: integer
          format: int32
          minimum: 0
        max_wall_time_per_job_hr:
          type: integer
          format: int32
          minimum: 0
        min_nodes_per_job:
          type: integer
          format: int32
          minimum: 0
    ServerErrorResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result: {}
        status:
          type: integer
          format: int32
          default: 500
          minimum: 0
        version:
          type: string
    State:
      type: string
      enum:
        - NotDeployed
        - Running
        - Stopped
        - Failed
        - Blocked
        - Unknown
    Strategy:
      type: object
      required:
        - name
        - platform
        - parameters
        - config
        - enabled
      properties:
        config:
          $ref: '#/components/schemas/StrategyConfig'
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        name:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/Parameter'
        platform:
          $ref: '#/components/schemas/Platform'
    StrategyConfig:
      type: object
      required:
        - supported_paralellism_strategies
        - supported_deployment_modalities
        - min_replicas
      properties:
        max_replicas:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        max_ttl:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        min_replicas:
          type: integer
          format: int64
          minimum: 0
        supported_deployment_modalities:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentModality'
        supported_paralellism_strategies:
          type: array
          items:
            $ref: '#/components/schemas/ParallelismStrategy'
    Visibility:
      type: string
      enum:
        - Public
        - Private
