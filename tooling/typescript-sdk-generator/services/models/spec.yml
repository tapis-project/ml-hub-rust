openapi: 3.1.0
info:
  title: MLHub Models API
  description: ''
  license:
    name: ''
  version: 0.1.0
paths:
  /models-api/artifacts:
    get:
      tags:
        - Artifacts
      description: List all model artifacts
      operationId: list_model_artifacts
      responses:
        '200':
          description: Listed model artifacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelArtifactResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /models-api/artifacts/{artifact_id}:
    get:
      tags:
        - Artifacts
      description: Fetches the model artifact by the provided id
      operationId: get_model_artifact
      parameters:
        - name: artifact_id
          in: path
          description: Artifact id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found model artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetModelArtifactResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /models-api/artifacts/{artifact_id}/model:
    post:
      tags:
        - Artifacts
      summary: Associate an owned model with an artifact
      operationId: associate_model_with_artifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssociateModelBody'
        required: true
      responses:
        '200':
          description: Model associated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociateModelResponse'
        '400':
          description: Invalid identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Model or artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Artifact already associated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Unable to associate model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /models-api/artifacts/{artifact_id}/publications:
    get:
      tags:
        - Publications
      description: List all publications for an artifact
      operationId: list_publications_for_artifact
      parameters:
        - name: artifact_id
          in: path
          description: The ID of the artifact
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Listed model publications for artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelPublicationsForArtifactResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
    post:
      tags:
        - Publications
      description: Publish a model artifact to an external platform
      operationId: publish_model_artifact
      parameters:
        - name: artifact_id
          in: path
          description: The ID of the model artifact
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishArtifactRequest'
        required: true
      responses:
        '200':
          description: Discovered models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishModelArtifactResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /models-api/external-models/search:
    post:
      tags:
        - ExternalModels
      summary: Search the external model catalog
      operationId: discover_external_models
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: include_count
          in: query
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverExternalModelsBody'
        required: true
      responses:
        '200':
          description: ExternalModels found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverExternalModelsResponse'
        '400':
          description: Invalid search
        '500':
          description: Unable to search ExternalModels
  /models-api/external-models/{external_model_id}:
    get:
      tags:
        - ExternalModels
      summary: Get an external model
      operationId: get_external_model
      parameters:
        - name: external_model_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ExternalModel found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExternalModelResponse'
        '404':
          description: ExternalModel not found
        '500':
          description: Unable to get ExternalModel
  /models-api/external-models/{external_model_id}/deployment-options:
    get:
      tags:
        - ExternalModels
      summary: List deployment options for an external model
      operationId: list_external_model_deployment_options
      parameters:
        - name: external_model_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: >-
            Maximum number of deployment options to return. Values are capped at
            100.
          required: false
          schema:
            type: integer
            format: int32
            maximum: 100
            minimum: 1
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous page.
          required: false
          schema:
            type: string
        - name: include_count
          in: query
          description: Include the number of deployment options for the ExternalModel.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Deployment options listed
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/ListExternalModelDeploymentOptionsResponse
        '400':
          description: Invalid external model identifier or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: ExternalModel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Unable to list deployment options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /models-api/external-models/{external_model_id}/deployment-options/{deployment_option_id}:
    get:
      tags:
        - ExternalModels
      summary: Get a deployment option and its required parameters
      operationId: get_external_model_deployment_option
      parameters:
        - name: external_model_id
          in: path
          description: ExternalModel identifier
          required: true
          schema:
            type: string
            format: uuid
        - name: deployment_option_id
          in: path
          description: DeploymentOption identifier
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deployment option found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExternalModelDeploymentOptionResponse'
        '400':
          description: Invalid identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: ExternalModel or DeploymentOption not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Unable to get deployment option
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /models-api/ingestions:
    get:
      tags:
        - Ingestions
      description: List all model ingestions
      operationId: list_model_ingestions
      responses:
        '200':
          description: Listed model ingestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelIngestionsResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /models-api/ingestions/{ingestion_id}:
    get:
      tags:
        - Ingestions
      description: Fetch an ingestion by id
      operationId: get_model_ingestion
      parameters:
        - name: ingestion_id
          in: path
          description: The ID of the model ingestion
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fetched Model Ingestion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetModelIngestionResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /models-api/models:
    get:
      tags:
        - Models
      summary: List owned or shared models
      operationId: list_models
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - Owned
              - Shared
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: include_count
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Models listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'
        '500':
          description: Unable to list models
    post:
      tags:
        - Models
      summary: Add an external model to the user's collection
      operationId: create_model
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelBody'
        required: true
      responses:
        '201':
          description: Model created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateModelResponse'
        '400':
          description: Invalid model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: ExternalModel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Model already in your collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Unable to create model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /models-api/models/{model_id}:
    get:
      tags:
        - Models
      summary: Get a model from a tenant collection
      operationId: get_model
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Model found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetModelResponse'
        '404':
          description: Model not found
        '500':
          description: Unable to get model
  /models-api/platforms:
    get:
      tags:
        - Platforms
      description: List all external platforms integrated with this deployment of MLHub
      operationId: list_platforms
      responses:
        '200':
          description: Listed platforms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPlatformsResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /models-api/publications:
    get:
      tags:
        - Publications
      description: List all model publications
      operationId: list_model_publications
      responses:
        '200':
          description: Listed model publications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelPublicationsResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /models-api/publications/{publication_id}:
    get:
      tags:
        - Publications
      description: Fetch a publication by id
      operationId: get_model_publication
      parameters:
        - name: publication_id
          in: path
          description: The ID of the model publication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Discovered models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetModelPublicationResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /models-api/tasks:
    get:
      tags:
        - Tasks
      description: List all model tasks/capabilities
      operationId: list_tasks
      responses:
        '200':
          description: Listed tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTasksResponse'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
components:
  schemas:
    Artifact:
      type: object
      required:
        - id
        - artifact_type
        - created_at
        - last_modified
      properties:
        artifact_type:
          $ref: '#/components/schemas/ArtifactType'
        created_at:
          type: string
        id:
          type: string
        last_modified:
          type: string
    ArtifactIngestion:
      type: object
      required:
        - id
        - artifact_id
        - platform
        - status
        - created_at
        - last_modified
      properties:
        artifact_id:
          type: string
        created_at:
          type: string
        id:
          type: string
        last_message:
          type:
            - string
            - 'null'
        last_modified:
          type: string
        platform:
          type: string
        status:
          $ref: '#/components/schemas/ArtifactIngestionStatus'
        webhook_url:
          type:
            - string
            - 'null'
    ArtifactIngestionStatus:
      type: string
      enum:
        - Submitted
        - Resubmitted
        - Pending
        - Downloading
        - Downloaded
        - Archiving
        - Archived
        - Finished
        - Failed
    ArtifactPublication:
      type: object
      required:
        - id
        - status
        - artifact_id
        - target_platform
        - attempts
        - created_at
        - last_modified
      properties:
        artifact_id:
          type: string
        attempts:
          type: integer
          format: int32
          minimum: 0
        created_at:
          type: string
        id:
          type: string
        last_message:
          type:
            - string
            - 'null'
        last_modified:
          type: string
        status:
          $ref: '#/components/schemas/ArtifactPublicationStatus'
        target_platform:
          type: string
    ArtifactPublicationStatus:
      type: string
      enum:
        - Submitted
        - Pending
        - Extracting
        - Extracted
        - PublishingModel
        - PublishedModel
        - PublishingArtifact
        - PublishedArtifact
        - Finished
        - Failed
    ArtifactType:
      type: string
      enum:
        - Model
        - Dataset
    AssociateModelBody:
      type: object
      required:
        - model_id
      properties:
        model_id:
          type: string
          format: uuid
      additionalProperties: false
    AssociateModelResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          $ref: '#/components/schemas/Model'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    BadRequestResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result: {}
        status:
          type: integer
          format: int32
          default: 400
          minimum: 0
        version:
          type: string
    ConflictResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result: {}
        status:
          type: integer
          format: int32
          default: 409
          minimum: 0
        version:
          type: string
    CreateModelBody:
      type: object
      required:
        - name
        - external_model_id
      properties:
        description:
          type:
            - string
            - 'null'
        external_model_id:
          type: string
          format: uuid
        name:
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
      additionalProperties: false
    CreateModelResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          $ref: '#/components/schemas/Model'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    DataCenter:
      type: string
      enum:
        - Tacc
    DeploymentModality:
      type: string
      enum:
        - Batch
        - Service
    DeploymentOption:
      type: object
      required:
        - id
        - external_model_id
        - supported_deployment_modalities
        - serving_runtime
        - deployment_target_type
        - available
        - created_at
        - updated_at
      properties:
        available:
          type: boolean
        created_at:
          type: string
        deployment_target_type:
          $ref: '#/components/schemas/DeploymentTargetType'
        external_model_id:
          type: string
          format: uuid
        hpc_cluster_queue:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/HpcClusterQueueTarget'
        id:
          type: string
          format: uuid
        serving_runtime:
          $ref: '#/components/schemas/ServingRuntime'
        supported_deployment_modalities:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentModality'
        updated_at:
          type: string
    DeploymentOptionDetail:
      allOf:
        - $ref: '#/components/schemas/DeploymentOption'
        - type: object
          required:
            - parameters
          properties:
            parameters:
              type: array
              items:
                $ref: '#/components/schemas/DeploymentParameter'
    DeploymentParameter:
      type: object
      required:
        - name
        - required
        - secret
        - parameter_type
      properties:
        choices:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/DeploymentParameterChoice'
        default:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        name:
          type: string
        parameter_type:
          $ref: '#/components/schemas/DeploymentParameterType'
        required:
          type: boolean
        secret:
          type: boolean
    DeploymentParameterChoice:
      type: object
      required:
        - value
        - enabled
      properties:
        description:
          type:
            - string
            - 'null'
        enabled:
          type: boolean
        value:
          type: string
    DeploymentParameterType:
      type: string
      enum:
        - String
        - Integer
        - Float
        - Boolean
    DeploymentTargetType:
      type: string
      enum:
        - HpcClusterQueue
    DerivedModelMetadata:
      type: object
      required:
        - inference_runtimes
        - tags
        - task_types
        - size
        - gated
        - private
      properties:
        author:
          type:
            - string
            - 'null'
        downloads:
          type:
            - integer
            - 'null'
          minimum: 0
        gated:
          type: boolean
        inference_runtimes:
          type: array
          items:
            type: string
        license:
          type:
            - string
            - 'null'
        likes:
          type:
            - integer
            - 'null'
          minimum: 0
        name:
          type:
            - string
            - 'null'
        private:
          type: boolean
        size:
          type: integer
          format: int64
          minimum: 0
        tags:
          type: array
          items:
            type: string
        task_types:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    DiscoverExternalModelsBody:
      type: object
      properties:
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryCriterion'
      additionalProperties: false
    DiscoverExternalModelsResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          type: array
          items:
            $ref: '#/components/schemas/ExternalModel'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    DiscoveryCriterion:
      type: object
      properties:
        author:
          type:
            - string
            - 'null'
        batch_scheduler_queue_ids:
          type: array
          items:
            type: string
            format: uuid
        has_deployment_options:
          type:
            - boolean
            - 'null'
        hpc_cluster_ids:
          type: array
          items:
            type: string
            format: uuid
        inference_runtimes:
          type: array
          items:
            type: string
        license:
          type:
            - string
            - 'null'
        max_downloads:
          type:
            - integer
            - 'null'
          minimum: 0
        max_likes:
          type:
            - integer
            - 'null'
          minimum: 0
        max_size:
          type:
            - integer
