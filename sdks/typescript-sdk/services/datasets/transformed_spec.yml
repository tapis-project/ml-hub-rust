openapi: 3.0.3
info:
  title: MLHub Datasets API
  description: ''
  license:
    name: ''
  version: 0.1.0
paths:
  /datasets-api/datasets:
    get:
      tags:
        - Datasets
      summary: List datasets
      operationId: list_datasets
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - Owned
              - Shared
      responses:
        '200':
          description: Datasets listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDatasetsResponse'
        '500':
          description: Unable to list datasets
    post:
      tags:
        - Datasets
      summary: Register a dataset
      operationId: register_dataset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDatasetBody'
        required: true
      responses:
        '200':
          description: Dataset registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDatasetResponse'
        '400':
          description: Invalid dataset registration
        '500':
          description: Unable to register dataset
  /datasets-api/datasets/{dataset_id}:
    get:
      tags:
        - Datasets
      summary: Get a dataset
      operationId: get_dataset
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dataset found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatasetResponse'
        '404':
          description: Dataset not found
        '500':
          description: Unable to get dataset
  /datasets-api/healthcheck:
    get:
      tags:
        - Health
      summary: Check service health
      operationId: healthcheck
      responses:
        '200':
          description: Service is healthy
components:
  schemas:
    Dataset:
      type: object
      required:
        - id
        - tenant_id
        - owner
        - tags
        - provider
        - huggingface_repo_locator
        - tapis_system_locator
        - items
        - size
        - visibility
      properties:
        huggingface_repo_locator:
          $ref: '#/components/schemas/HuggingFaceRepoLocator'
          nullable: true
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/DatasetItem'
        owner:
          type: string
        provider:
          $ref: '#/components/schemas/DatasetProvider'
        size:
          type: integer
          format: int64
          minimum: 0
        tags:
          type: array
          items:
            type: string
        tapis_system_locator:
          $ref: '#/components/schemas/TapisSystemLocator'
          nullable: true
        tenant_id:
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
    DatasetItem:
      type: object
      required:
        - path
        - size
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
    DatasetProvider:
      type: string
      enum:
        - HuggingFace
        - Tapis
    GetDatasetResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          $ref: '#/components/schemas/Dataset'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    HuggingFaceRepoLocator:
      type: object
      required:
        - id
        - sha
      properties:
        id:
          type: string
        sha:
          type: string
    ListDatasetsResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    RegisterDatasetBody:
      type: object
      required:
        - provider
        - items
        - size
      properties:
        huggingface_repo_locator:
          $ref: '#/components/schemas/HuggingFaceRepoLocator'
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/DatasetItem'
        provider:
          $ref: '#/components/schemas/DatasetProvider'
        size:
          type: integer
          format: int64
          minimum: 0
        tags:
          type: array
          items:
            type: string
        tapis_system_locator:
          $ref: '#/components/schemas/TapisSystemLocator'
          nullable: true
        visibility:
          $ref: '#/components/schemas/Visibility'
      additionalProperties: false
    RegisterDatasetResponse:
      type: object
      required:
        - result
        - status
        - message
        - metadata
        - version
      properties:
        message:
          type: string
        metadata:
          type: object
        result:
          $ref: '#/components/schemas/Dataset'
        status:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    TapisSystemLocator:
      type: object
      required:
        - site_id
        - tenant_id
        - system_id
        - path
      properties:
        path:
          type: string
        site_id:
          type: string
        system_id:
          type: string
        tenant_id:
          type: string
    Visibility:
      type: string
      enum:
        - Public
        - Private
