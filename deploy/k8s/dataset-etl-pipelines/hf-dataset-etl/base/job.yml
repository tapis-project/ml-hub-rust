apiVersion: batch/v1
kind: Job
metadata:
  name: mlhub-hf-dataset-etl
spec:
  backoffLimit: 0
  template:
    metadata:
      name: mlhub-hf-dataset-etl
    spec:
      restartPolicy: Never
      initContainers:
        - name: extract
          env:
            - name: INBOX
              value: /srv/mlhub/hf-dataset-etl/inbox
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mlhub-huggingface-secrets
                  key: token
            - name: MAX_RECORDS
              value: "5000"
          image: mlhub/hf-dataset-etl-extract:local
          command: ["sh", "-c", "python3 /src/extract.py"]
          volumeMounts:
            - name: nfs-server-mount
              mountPath: /srv/mlhub/
      containers:
        - name: hf-dataset-etl
          env:
            - name: RUST_LOG
              value: debug
            - name: MONGO_HOST
              value: mlhub-mongo-stateful-set-0.mlhub-mongo-headless-service.default.svc.cluster.local
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DBNAME
              value: mlhub
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mlhub-mongo-secrets
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlhub-mongo-secrets
                  key: password
            - name: MONGO_REPLICA_SET
              value: rs0
            - name: MAX_PROCESSABLE_ENTRIES
              value: "5000"
            - name: INBOX
              value: /srv/mlhub/hf-dataset-etl/inbox
          image: mlhub/hf-dataset-etl-transform-load:local
          imagePullPolicy: Never
          resources: {}
          volumeMounts:
            - name: nfs-server-mount
              mountPath: /srv/mlhub/
      volumes:
        - name: nfs-server-mount
          nfs:
            server: "**-NFS_SERVER_COMPONENT_IP-**"
            path: /
