admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: endpoint_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: endpoint_envoy
                stream_idle_timeout: 900s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: >
                            endpoint_envoy request_id="%REQ(X-REQUEST-ID)%"
                            method="%REQ(:METHOD)%"
                            status=%RESPONSE_CODE%
                            response_code_details="%RESPONSE_CODE_DETAILS%"
                            upstream_cluster="%UPSTREAM_CLUSTER%"
                            upstream_host="%UPSTREAM_HOST%"
                            transport_failure="%UPSTREAM_TRANSPORT_FAILURE_REASON%"
                            duration_ms=%DURATION%
                route_config:
                  name: endpoint_routes
                  virtual_hosts:
                    - name: endpoint_envoy
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: dynamic_forward_proxy_cluster
                            timeout: 0s
                          typed_per_filter_config:
                            envoy.filters.http.cors:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match:
                                - safe_regex:
                                    regex: "__ALLOWED_ORIGIN_REGEX__"
                              allow_methods: "GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS"
                              allow_headers: "X-Tapis-Token,Content-Type,Accept,Cache-Control,Last-Event-ID"
                              expose_headers: "Content-Type,Cache-Control"
                              max_age: "86400"
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      failure_mode_allow: false
                      mutation_rules:
                        allow_all_routing: true
                      grpc_service:
                        envoy_grpc:
                          cluster_name: endpoint_router
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: NONE
                        response_body_mode: NONE
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                  - name: envoy.filters.http.set_filter_state
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
                      on_request_headers:
                        - object_key: envoy.upstream.dynamic_host
                          format_string:
                            text_format_source:
                              inline_string: "%REQ(x-mlhub-upstream-host)%"
                        - object_key: envoy.upstream.dynamic_port
                          format_string:
                            text_format_source:
                              inline_string: "%REQ(x-mlhub-upstream-port)%"
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      allow_dynamic_host_from_filter_state: true
                      dns_cache_config:
                        name: endpoint_dns_cache
                        dns_lookup_family: ALL
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_request(request_handle)
                            request_handle:headers():remove("x-mlhub-upstream-host")
                            request_handle:headers():remove("x-mlhub-upstream-port")
                          end
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: authorization
                          - remove: connection
                          - remove: keep-alive
                          - remove: proxy-authenticate
                          - remove: proxy-authorization
                          - remove: te
                          - remove: trailer
                          - remove: transfer-encoding
                          - remove: upgrade
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: endpoint_router
      type: STRICT_DNS
      connect_timeout: 5s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: endpoint_router
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: mlhub-endpoint-router-service
                      port_value: 9000

    - name: dynamic_forward_proxy_cluster
      connect_timeout: 10s
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config:
            name: endpoint_dns_cache
            dns_lookup_family: ALL
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          auto_host_sni: true
          auto_sni_san_validation: true
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt
