apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlhub-agents-api-deployment
spec:
  selector:
    matchLabels:
      app: mlhub-agents-api-deployment
  template:
    metadata:
      labels:
        app: mlhub-agents-api-deployment
    spec:
      containers:
        - name: agents-api
          image: tapis/mlhub-agents-api:local
          imagePullPolicy: Never
          env:
            - name: RUST_LOG
              value: debug
          ports:
            - containerPort: 8000
              name: webserver
          readinessProbe:
            httpGet:
              path: /agents-api/healthcheck
              port: webserver
            initialDelaySeconds: 2
            periodSeconds: 15
            failureThreshold: 5
          resources: {}
          tty: true
