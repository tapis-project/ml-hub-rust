resources:
  - ../../base
  - ../../../site-configs/overlays/tapisprod

patches:
  - target:
      kind: Deployment
      name: mlhub-agents-api-deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mlhub-agents-api-deployment
      spec:
        template:
          spec:
            containers:
              - name: agents-api
                image: tapis/mlhub-agents-api:26Q2.1
                imagePullPolicy: Always
                resources: {}
