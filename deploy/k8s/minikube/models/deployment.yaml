apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlhub-models-api-deployment
spec:
  selector:
    matchLabels:
      app: mlhub-models-api-deployment
  template:
    metadata:
      labels:
        app: mlhub-models-api-deployment
    spec:
      containers:
        # - name: debugger
        #   image: busybox
        #   command: ["/bin/sh", "-c", "sleep infinity"]
        #   volumeMounts:
        #     - name: site-config
        #       mountPath: /etc/mlhub/site.json
        #       subPath: site.json 
        - name: models-api
          image: tapis/models-api:local
          imagePullPolicy: Never
          env:
            - name: MONGO_HOST
              value: mlhub-mongo-service
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_NAME
              value: mlhub
            - name: MONGO_PASSWORD
              value: password
            - name: MONGO_USERNAME
              value: mlhub
            - name: RABBIT_HOST
              value: mlhub-rabbit-service
            - name: RABBIT_PASSWORD
              value: dev
            - name: RABBIT_PORT
              value: "5672"
            - name: RABBIT_USER
              value: dev
            - name: RUST_LOG
              value: debug
            - name: SHARED_DATA
              value: /srv/mlhub
            - name: CLIENT_DEPLOYMENT_STRATEGIES_DIR
              value: /etc/mlhub/deployment-strategies.d
            - name: SITE_CONFIG_PATH
              value: /etc/mlhub/site.json
          ports:
            - containerPort: 8000
              name: webserver
          # readinessProbe:
          #   httpGet:
          #     path: /models-api/health-check
          #     port: 8000
          #   initialDelaySeconds: 2
          #   periodSeconds: 15
          #   failureThreshold: 5

          resources: {}
          tty: true
          volumeMounts:
            - name: nfs-server-mount
              mountPath: /srv/mlhub/
            - name: tapis-deployment-strategies
              mountPath: /etc/mlhub/deployment-strategies.d/tapis.json
              subPath: tapis.json
            - name: site-config
              mountPath: /etc/mlhub/site.json
              subPath: site.json
      volumes:
        - name: nfs-server-mount
          nfs:
            server: '{{ NFS_SERVER_COMPONENT_IP }}'
            path: /
        - name: tapis-deployment-strategies
          configMap:
            name: tapis-deployment-strategies
        - name: site-config
          configMap:
            name: mlhub-site-config