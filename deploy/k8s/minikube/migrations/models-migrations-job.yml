apiVersion: batch/v1
kind: Job
metadata:
  name: mlhub-models-migrator
spec:
  backoffLimit: 0
  template:
    metadata:
      name: mlhub-models-migrator
    spec:
      restartPolicy: Never
      containers:
        - env:
            - name: MONGO_HOST
              value: mlhub-mongo-stateful-set-0.mlhub-mongo-headless-service.default.svc.cluster.local
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_NAME
              value: mlhub
            - name: MONGO_PASSWORD
              value: password
            - name: MONGO_USERNAME
              value: mlhub
            - name: MONGO_REPLICA_SET
              value: rs0
            - name: RABBIT_HOST
              value: mlhub-rabbit-service
            - name: RABBIT_PASSWORD
              value: dev
            - name: RABBIT_PORT
              value: "5672"
            - name: RABBIT_USER
              value: dev
            - name: RUST_LOG
              value: debug
            - name: SHARED_DATA
              value: /srv/mlhub
          image: mlhub/models-migrator:local
          imagePullPolicy: Never
          name: models-migrator
          resources: {}
