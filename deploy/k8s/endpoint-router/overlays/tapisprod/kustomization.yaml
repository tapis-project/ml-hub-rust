resources:
  - ../../base
  - ../../../site-configs/overlays/tapisprod

images:
  - name: tapis/mlhub-endpoint-router
    newTag: 26Q3.1

patches:
  - target:
      kind: Deployment
      name: mlhub-endpoint-router-deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mlhub-endpoint-router-deployment
      spec:
        template:
          spec:
            containers:
              - name: endpoint-router
                imagePullPolicy: Always
                env:
                  - name: MONGO_HOST
                    value: mlhub-mongo-stateful-set-0.mlhub-mongo-headless-service.tapisprod.svc.cluster.local
