[workspace]
resolver = "2"

members = [
    "services/agents",
    "services/datasets",
    "services/deployments",
    "services/models",
    "services/artifact-ingester",
    "services/artifact-publisher",
    "services/hf-dataset-etl",
    "services/hf-model-etl",
    "services/models-migrator",
    "services/principals-migrator",
    "services/federated-identities-migrator",
    "services/model-deployment-controller",
    "sdks/agntcy-sdk",
    "libs/client-provider",
    "libs/clients",
    "libs/platforms",
    "libs/git-lfs-client",
    "libs/github-lfs-client",
    "libs/huggingface-client",
    "libs/patra-client",
    "libs/s3-client",
    "libs/shared",
    "libs/huggingface-tasks",
    "libs/tapis-client",
    "libs/retry-utils",
]

[workspace.dependencies]
validator = { version = "0.21.0", features = ["derive"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
semver = "1.0.26"
strum = "0.28.0"
strum_macros = "0.28.0"
